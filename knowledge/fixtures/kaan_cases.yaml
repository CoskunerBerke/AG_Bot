    expect: short
    setup: ten_am
    bias: short
    window: ["10:00", "10:45"]
    stop: "~16 puan, yakın relative high üstü"
    outcome: be
    why: "Günlük bearish; 9:30'da displacement'lı ayı mumu. 10AM mumu 3dk volume imbalance'a dokunup RB bıraktı; 1dk OTE (tepe→dip) 0.705-0.79 + RB + 10AM çizgisi = 3 confluence. Drawdown sonrası BE."
    src: "transcript1 00:30-05:30"

  - date: 2026-08-25
