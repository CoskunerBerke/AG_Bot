# Kaan ekibinin tarihli kararları → botun uyum testi (python main.py dmc-fidelity)
# Kaynak: transcript1 (Efe & Ahmet, NQ, 3 haftalık 10AM/DMC backtest'i, 2026). Metinler bizim özetimizdir.
# expect: long | short | none   (günün ANA işlemi)
# setup : ten_am | dmc_rb | kaanermi | lunch   (ekibin kullandığı model)
# window: işlemin açıldığı yaklaşık NY saat aralığı
# bias  : ekibin o gün okuduğu yön (long | short | neutral)
# scope: ekibin bu incelemede değerlendirdiği modeller ve saat — kapsam dışı bot işlemleri karşılaştırmaya girmez
scope: {setups: [kaan, ten_am, dmc_rb, kaanermi], until: "12:00"}
# news: ekibin videoda andığı haberler (geçmiş takvim olmadığı için elle) — motorun haber filtresine verilir
cases:
