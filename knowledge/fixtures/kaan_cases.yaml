    why: "Önceki gün bearish kapanış, altta dolmamış bullish gap'ler hedef. 9:30 yukarı manipülasyon; 3dk'da equal high'ları süpüren RB'ye ilk temas (C-level dokunulmamış) → short; 10AM'den önce."
    src: "transcript1 05:30-11:30"

