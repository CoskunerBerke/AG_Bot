# ============================================================
#  Kaanermi (DMC) v2 Yerel İşlem Botu — 10AM, DMC RB, Kaan, Lunch, Box
#  Kurallar: knowledge/  ·  Komutlar: python main.py -h
# ============================================================
data:
  cache_dir: .cache

dmc:
  symbol: QQQ                  # backtest/scan varsayılanı (NQ verisi için --set symbol=NQ.v.0)
  symbols: [QQQ, TQQQ, SPY, DIA, GLD, SLV]   # 6 enstrümanın tamamı sabirli_coklu + ff_macro için aktif
  watch_only: []               # Bot C tüm 6 sembolde (QQQ, TQQQ, SPY, DIA, GLD, SLV) yüksek onaylı kurumsal işlem arar
  watch_setups: {}
  nq_atr1_ref: 13.0            # NQ medyan 1 dk mum boyu (puan) — Kaan'ın puanlarını diğer enstrümanlara çevirir
  max_trades_total: 10         # her setup sembol başına günde 1 kez + aynı anda tek pozisyon
  max_open_total: 1            # aynı anda açık pozisyon (tüm semboller)
  risk_per_trade_pct: 1.0      # işlem başı kasa riski %1.0 (Alpaca 4x alım gücü sınırları dahilinde tam kapasite)
  corr_groups: [[QQQ, TQQQ, SPY, DIA], [GLD, SLV]]   # korele endekslerde ve metallerde aynı anda tek bekleyen giriş
  bp_multiplier: 4             # Alpaca gün içi alım gücü katsayısı
  bp_usage: 0.9                # alım gücünün en fazla %90'ı
  bp_slots: 1                  # max_open_total=1 olduğu için alım gücünün tamamı (%90 * 4x = 3.6x) aktif işleme ayrılır
  vol_mult: {TQQQ: 3, SLV: 1.9}   # 1 dk mum oynaklığı / QQQ (%0.046): stop % sınırları bu katla genişler
  min_confluence: 3
  limit_entry_min_confluence: 4
  ote: {lo: 0.62, mid: 0.705, hi: 0.79}
  stop_buffer_pct: 0.0001      # yapısal stop + %0.01 tampon
  min_stop_pct: 0.0002         # %0.02'den dar stop = gürültü
  max_stop_pct: 0.0012         # %0.12 (NQ ~37 puan) üstü alınmaz
  tp1_min_rr: 1.0
  min_rr_tp2: 3.0
  tp1_fraction: 0.5
  max_trades_per_day: 10
  max_open_positions: 1
  halt_after_stops: 2          # [Y] 2 stop sonrası gün kapanır
  flat_time: "15:55"
  fvg: {lookback_days_15m: 3, lookback_days_60m: 10}
  manage:                      # işlem yönetimi (Kaan): 0/false = kapalı
    be_at_r: 0                 # lehte bu kadar R gidince stop girişe (BE)
    stall_min: 0               # dolumdan sonra bu kadar dakika içinde stall_r·R gelmezse çık (RB'de sıkışma)
    stall_r: 0.5
    trail_after_tp1: false     # TP1'den sonra stopu her yeni 5 dk swing'in arkasına taşı
  setups:
    kaanermi: {enabled: false, repeat: false, window_start: "09:30", window_end: "11:30", require_bias: off,
               breaker: true, atr_min: 0.77, atr_max: 1.9, atr_pad: 0.15, min_rr_tp2: 4.0, stale_min: 45}
    # Filtresiz kaan/ten_am/dmc_rb Bot A ve B'de çalışır; Bot C'de filtreli halleri sabirli_coklu (Sütun 3 ve 4) içindedir
    kaan:   {enabled: false, repeat: false, window_start: "13:00", window_end: "14:00", require_bias: not_against,
             atr_min: 1.0, atr_max: 3.0, atr_pad: 0.25, min_rr_tp2: 3.0, stale_min: 60,
             risk_mult: 0.5}
    ten_am: {enabled: false, open: "10:00", window_end: "11:30", confirm_tf: 5, chop_flips: 3,
             min_excursion_pts: 5, min_stop_pts: 10, max_stop_pts: 25, pad_pts: 2, nq_ref: 30000, min_rr_tp2: 4.0,
             require_bias: off,
             entry_mode: limit, stdv_valid: true, msnr_pda: false}
    dmc_rb: {enabled: false, window_start: "09:30", window_end: "15:30", tfs: [15, 5, 3],
             require_bias: off, min_stop_pts: 10, wick_pad_pts: 0.25, nq_ref: 30000, min_rr_tp2: 3.0,
             htf_rule: off,
             min_wick_frac: 0.5,
             priority: 2}
    # Kaan'ın Lunch 5dk piyasa giriş modeli (2 yılda negatif olduğu için kapalı; öğle sonu pullback girişlerini 'kaan' modeli alır)
    lunch:  {enabled: false, range_start: "12:00", range_end: "13:00", window_end: "13:30", sweep_tf: 5,
             am_start: "09:30", am_end: "11:00",
             require_bias: not_against,
             stop_buffer_ticks: 1, tick: 0.01,
             liq_stop_pts: 10,
             min_rr_tp2: 1.0, htf_guard_pct: 0.0015, am_accum_ratio: 0.6, require_close_against: false,
             smt: require,
             mss_confirm: true, mss_wait_min: 15,
             risk_mult: 0.5}
    # Kaan'ın Box modeli (#15 — 2 yılda 8/9 stop olduğu için kapalı)
    box:    {enabled: false, window_start: "09:30", window_end: "13:15", box_bars: 8, box_atr_mult: 3.0,
             break_within_bars: 12, min_stop_pts: 10, wick_pad_pts: 0.25, min_rr_tp2: 2.0,
             risk_mult: 0.5}
    # --- Çoklu Taktik Kütüphanesi (Grafik Rejimine ve Walk-Forward Seçiciye Göre Aktifleşebilen Modeller) ---
    ekin_ifvg:      {enabled: false, window_start: "09:45", window_end: "15:00", require_bias: not_against,
                     atr_min: 1.0, atr_max: 3.2, atr_pad: 0.25, min_rr_tp2: 2.5, stale_min: 45}
    ict_unicorn:    {enabled: false, window_start: "09:40", window_end: "15:00", require_bias: not_against,
                     atr_min: 1.0, atr_max: 3.2, atr_pad: 0.25, min_rr_tp2: 2.5, stale_min: 45}
    smc_idm:        {enabled: false, window_start: "09:45", window_end: "15:00", require_bias: not_against,
                     atr_min: 1.0, atr_max: 3.5, atr_pad: 0.25, min_rr_tp2: 2.5}
    crt_range:      {enabled: false, range_end: "10:30", window_end: "14:00", require_bias: aligned,
                     atr_min: 1.0, atr_max: 2.8, atr_pad: 0.25, min_rr_tp2: 2.2}
    orderflow_vwap: {enabled: false, window_start: "10:20", window_end: "14:30", require_bias: aligned,
                     atr_min: 1.0, atr_max: 2.8, atr_pad: 0.25, min_rr_tp2: 2.2, vol_spike: 1.75}
    wyckoff_spring: {enabled: false, window_start: "10:15", window_end: "15:00", require_bias: not_against,
                     range_bars_5m: 9, atr_min: 1.0, atr_max: 3.2, atr_pad: 0.25, min_rr_tp2: 2.2}
    pa_srflip:      {enabled: false, window_start: "10:00", window_end: "14:45", require_bias: not_against,
                     atr_min: 1.0, atr_max: 3.5, atr_pad: 0.25, min_rr_tp2: 2.2}
    ff_macro:       {enabled: true, window_start: "09:40", window_end: "14:30", require_bias: aligned,
                     vol_spike: 1.55, atr_min: 1.0, atr_max: 2.8, atr_pad: 0.25, min_rr_tp2: 2.2}
    sabirli_coklu:  {enabled: true, window_start: "09:30", window_end: "14:30", require_bias: aligned,
                     min_tactics: 4, vol_spike: 1.75, vwap_sigma: 1.35,
                     atr_min: 1.0, atr_max: 2.8, atr_pad: 0.25, min_rr_tp2: 2.2}
  filters:
    monday_extra_confluence: 1
    friday_min_confluence: 4
    august_max_trades: 1
    red_news_block_minutes: 5    # kırmızı USD haberinin ±5 dk'sı
    speech_block_minutes: 30     # Fed konuşması / FOMC basın toplantısı ±30 dk
    fail_closed_news: false      # takvim alınamazsa da işlem sürer
    trend_gate: off
  backtest: {slippage_bps: 0.5, fill_ticks: 1}
