# ============================================================
#  Kaanermi (DMC) botu — 10AM, Rejection Block, Lunch modelleri
#  Kurallar: knowledge/  ·  Komutlar: python main.py -h
# ============================================================
data:
  cache_dir: .cache

dmc:
  symbol: QQQ                  # backtest/scan varsayılanı (NQ verisi için --set symbol=NQ.v.0)
  symbols: [QQQ, TQQQ, SPY, DIA, GLD, SLV]   # Kaan'ın endeksleri (NQ→QQQ/TQQQ, ES→SPY, YM→DIA) + altın, gümüş
  watch_only: []               # buradaki semboller işlem açmaz, sadece SMT verisi + "ne yapardı" kaydı
  watch_setups: [ten_am]       # 2026-10-14: 10AM sadece izlenir (1 yıl: 10AM'siz 4/4 fon daha iyi; Bot B'den taşındı)
  nq_atr1_ref: 13.0            # NQ medyan 1 dk mum boyu (puan) — Kaan'ın puanlarını diğer enstrümanlara çevirir
  max_trades_total: 10         # pratikte sınırsız: her setup sembol başına günde 1 kez + aynı anda tek pozisyon
  max_open_total: 1            # aynı anda açık pozisyon (tüm semboller)
  risk_per_trade_pct: 0.1      # eşit risk: her fonda ~aynı $ risk (QQQ alım gücüyle en fazla ~%0.09'a çıkabiliyor);
                               # 0.43'te TQQQ işlemleri QQQ'nun 3 katı riskliydi → R'de kâr (+6.7R) dolarda zarar (-560 $)
  corr_groups: [[QQQ, TQQQ]]   # aynı grafik: grupta aynı anda tek bekleyen giriş (çift dolum olmasın)
  bp_multiplier: 4             # Alpaca gün içi alım gücü katsayısı
  bp_usage: 0.9                # alım gücünün en fazla %90'ı
  bp_slots: 2                 # alım gücü 2 girişe bölünür; fiyata en yakın 2 giriş Alpaca'da bekler, diğerleri sırada
  vol_mult: {TQQQ: 3, SLV: 1.9}   # 1 dk mum oynaklığı / QQQ (%0.046): stop % sınırları bu katla genişler
  min_confluence: 3
  limit_entry_min_confluence: 4
  ote: {lo: 0.62, mid: 0.705, hi: 0.79}
  stop_buffer_pct: 0.0001      # yapısal stop + %0.01 tampon
  min_stop_pct: 0.0002         # %0.02'den dar stop = gürültü
  max_stop_pct: 0.0012         # %0.12 (NQ ~37 puan) üstü alınmaz
  tp1_min_rr: 1.0
  min_rr_tp2: 3.0
  tp1_fraction: 0.5
  max_trades_per_day: 10       # 1 yıl NQ: sınır 2 → -4.2R, sınırsız → +0.3R (Kaan: [K] 'az ama temiz', sabit sayı yok)
  max_open_positions: 1
  halt_after_stops: 2          # [Y] 2 stop sonrası gün kapanır (kaldırmak +1.4R/19 işlem — anlamsız fark, korunuyor)
  flat_time: "15:55"
  fvg: {lookback_days_15m: 3, lookback_days_60m: 10}
  manage:                      # işlem yönetimi (Kaan): 0/false = kapalı
    be_at_r: 0                 # lehte bu kadar R gidince stop girişe (BE)
    stall_min: 0               # dolumdan sonra bu kadar dakika içinde stall_r·R gelmezse çık (RB'de sıkışma)
    stall_r: 0.5
    trail_after_tp1: false     # TP1'den sonra stopu her yeni 5 dk swing'in arkasına taşı
  setups:
    kaanermi: {enabled: false, repeat: false, window_start: "09:30", window_end: "11:30", require_bias: off,
               breaker: true, atr_min: 0.77, atr_max: 1.9, atr_pad: 0.15, min_rr_tp2: 4.0, stale_min: 45}
    # Kaan'ın evrensel taktiği: süpürme → CISD+displacement → OTE'deki FVG/RB'ye limit; saatten bağımsız
    # Lunch sonu MSS/OB girişi (Kaan canlı: NY high likiditesi alındı → MSS → order block'tan short, 7.5R):
    # süpürme → 3 dk CISD + displacement → OTE'deki OB/FVG/RB; sadece 13:00-14:00
    kaan:   {enabled: true, repeat: false, window_start: "13:00", window_end: "14:00", require_bias: not_against,
             atr_min: 1.0, atr_max: 3.0, atr_pad: 0.25, min_rr_tp2: 3.0, stale_min: 60,
             risk_mult: 0.5}                               # RB'ye ağırlık: diğer modeller yarım büyüklük
    # Kaan'ın saat bazlı modelleri — 46 gerçek işleminin 38'i 09:50-11:00 arası; varsayılan bunlar
    ten_am: {enabled: true, open: "10:00", window_end: "11:30", confirm_tf: 5, chop_flips: 3,
             min_excursion_pts: 5, min_stop_pts: 10, max_stop_pts: 25, pad_pts: 2, nq_ref: 30000, min_rr_tp2: 4.0,
             require_bias: off,                            # Kaan'ın 46 işleminde günlük bias yönü tutmadı (~%55)
             entry_mode: limit, stdv_valid: false, msnr_pda: false}                            # limit: PDA kenarına limit | confirm: 3 dk kapanış onayı
    dmc_rb: {enabled: true, window_start: "09:30", window_end: "15:30", tfs: [15, 5, 3],   # 1 yıl: 14:00→15:30 3/4 fon iyi; repeat 3/4 kötü
             require_bias: off, min_stop_pts: 10, wick_pad_pts: 0.25, nq_ref: 30000, min_rr_tp2: 3.0,
             htf_rule: off,                                # off | require (LTF RB bir HTF RB'nin içinde)
             min_wick_frac: 0.5,                           # [K] #21 uzun temiz fitil (1 yıl 4/4 fon iyileşti; Bot B'den)
             priority: 2}                                  # alım gücü sırasında RB emirleri öncelikli (tam büyüklük)
    lunch:  {enabled: true, range_start: "12:00", range_end: "13:00", window_end: "13:30", sweep_tf: 5,
             am_start: "09:30", am_end: "11:00",           # Kaan'ın killzone göstergesi: NY AM 09:30-11:00
             require_bias: not_against,                    # [K] Lunch'ta bias en önemli faktör
             stop_buffer_ticks: 1, tick: 0.01,             # stop = iğne ucu + 1 tick
             liq_stop_pts: 10,                             # iğnenin ötesinde ≤10 NQ puanı içinde likidite varsa stop onun ötesine
             min_rr_tp2: 1.0, htf_guard_pct: 0.0015, am_accum_ratio: 0.6, require_close_against: false,
             smt: require,                                 # [K] SMT güçlendirir; 1 yıl NQ: -6.8R → -4.2R
             mss_confirm: true, mss_wait_min: 15,          # [K] iğneden sonra MSS'i bekle (Bot B'den taşındı)
             risk_mult: 0.5}
    box:    {enabled: true, window_start: "09:30", window_end: "15:00", box_bars: 8, box_atr_mult: 3.0,
             break_within_bars: 12, min_stop_pts: 10, wick_pad_pts: 0.25, min_rr_tp2: 2.0,   # [K] #15 Box setup
             risk_mult: 0.5}
  filters:
    monday_extra_confluence: 1
    friday_min_confluence: 4
    august_max_trades: 1
    red_news_block_minutes: 5    # kırmızı USD haberinin ±5 dk'sı
    speech_block_minutes: 30     # Fed konuşması / FOMC basın toplantısı ±30 dk
    fail_closed_news: false      # takvim alınamazsa da işlem sürer (bakımsız çalışmada bot günlerce durmasın)
    trend_gate: off              # open: 09:30/10:00 açılışının altında long, üstünde short yok. 1 yıl: A ve B'de kötüleştirdi (B: NQ +54→+5R) → kapalı
  backtest: {slippage_bps: 0.5, fill_ticks: 1}   # QQQ makas 1 sent; stop kayması ~3-4 sent
