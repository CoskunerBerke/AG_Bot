services:
  nasdaq-bot:                       # Bot A: Antigravity V4.1'in sabit kopyası (bot_a_v41/), .env'deki paper hesap
    build: ./bot_a_v41
    container_name: nasdaq_trading_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes: &vols
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./state:/app/state
      - ./.cache:/app/.cache
    environment: &envs
      - TZ=America/New_York
      - PYTHONUNBUFFERED=1
    command: ["python", "main.py", "dmc-run"]

  nasdaq-bot-b:                     # Bot B (deneme): config.b.yaml farkları; ikinci Alpaca paper hesabı (.env.b)
    build: .
    container_name: nasdaq_trading_bot_b
    restart: unless-stopped
    profiles: ["b"]
    env_file:
      - .env.b
    volumes: *vols
    environment: *envs
    command: ["python", "main.py", "dmc-run", "--name", "b"]      # ayarlar: config.yaml + config.b.yaml

  nasdaq-bot-c:                     # Bot C: Antigravity kuralları (bot_c/ kodu, olduğu gibi); üçüncü paper hesap (.env.c)
    build: ./bot_c
    container_name: nasdaq_trading_bot_c
    restart: unless-stopped
    profiles: ["c"]
    env_file:
      - .env.c
    volumes: *vols
    environment: *envs
    command: ["python", "main.py", "dmc-run", "--name", "c"]

  bellek-tutucu:                    # Oracle "boşta VM" geri alımına karşı ~1,6 GB bellek tutar; CPU kullanmaz
    build: .
    container_name: ag_bellek_tutucu
    restart: unless-stopped
    command: ["python", "-c", "import time\nb = bytearray(1600 * 2**20)\nfor i in range(0, len(b), 4096):\n    b[i] = 1\nprint('bellek tutuluyor: 1600 MB', flush=True)\nwhile True:\n    time.sleep(3600)"]
