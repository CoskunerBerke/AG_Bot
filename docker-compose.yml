services:
  nasdaq-bot:                       # Bot A: tüm modeller (10AM dahil), .env'deki Alpaca paper hesabı
    build: .
    container_name: nasdaq_trading_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes: &vols
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./state:/app/state
      - ./.cache:/app/.cache
    environment: &envs
      - TZ=America/New_York
      - PYTHONUNBUFFERED=1
    command: ["python", "main.py", "dmc-run"]

  nasdaq-bot-b:                     # Bot B (deneme): config.b.yaml farkları; ikinci Alpaca paper hesabı (.env.b)
    build: .
    container_name: nasdaq_trading_bot_b
    restart: unless-stopped
    profiles: ["b"]
    env_file:
      - .env.b
    volumes: *vols
    environment: *envs
    command: ["python", "main.py", "dmc-run", "--name", "b"]      # ayarlar: config.yaml + config.b.yaml
